name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Render site
        if: hashFiles('state/knowledge_graph.json') != ''
        run: |
          python3 scripts/render_site.py || true
          python3 scripts/build_seo_assets.py || true

      - name: Upload Pages artifact
        if: hashFiles('outputs/site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
