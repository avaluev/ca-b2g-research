[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-b2g-research"
version = "1.0.0"
description = "Central Asia B2G Intelligence: Uzbekistan + Kyrgyzstan AI/Digital Government Opportunities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Alexandr Valuev", email = "valuev.alexandr@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "feedgen>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://avaluev.github.io/ca-b2g-research"
Repository = "https://github.com/avaluev/ca-b2g-research"
Issues = "https://github.com/avaluev/ca-b2g-research/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
